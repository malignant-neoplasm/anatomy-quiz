<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;

const words = [
  {en:"prescribed medicine", jp:"処方薬"},
  {en:"over-the-counter (OTC) drug", jp:"市販薬"},
  {en:"tablet", jp:"錠剤"},
  {en:"capsule", jp:"カプセル"},
  {en:"pill", jp:"丸薬"},
  {en:"granule", jp:"顆粒剤"},
  {en:"syrup", jp:"シロップ剤"},
  {en:"ointment", jp:"軟膏[剤]"},
  {en:"patch / poultice", jp:"湿布薬"},
  {en:"eye drops", jp:"点眼薬"},
  {en:"ear drops", jp:"点耳薬"},
  {en:"troche / lozenge", jp:"トローチ"},
  {en:"inhalant", jp:"吸入薬"},
  {en:"suppository", jp:"座薬"},
  {en:"enema", jp:"浣腸"},
  {en:"painkiller / analgesic", jp:"鎮痛薬"},
  {en:"fever reducer / antipyretic", jp:"解熱剤"},
  {en:"nonsteroidal antiinflammatory drug (NSAID)", jp:"非ステロイド性抗炎症薬"},
  {en:"aspirin", jp:"アスピリン"},
  {en:"steroid", jp:"ステロイド"},
  {en:"ibuprofen", jp:"イブプロフェン"},
  {en:"antibiotic", jp:"抗生物質"},
  {en:"immunosuppressant", jp:"免疫抑制薬"},
  {en:"antidote", jp:"解毒薬"},
  {en:"vasodilator", jp:"血管拡張薬"},
  {en:"blood thinner / anticoagulant", jp:"抗凝固薬"},
  {en:"antihypertensive", jp:"降圧薬"},
  {en:"hemostatic", jp:"止血薬"},
  {en:"diuretic", jp:"利尿薬"},
  {en:"antihistamine", jp:"抗ヒスタミン薬"},
  {en:"decongestant", jp:"うっ血除去薬，鼻づまり改善薬"},
  {en:"cough medicine / antitussive", jp:"鎮咳薬"},
  {en:"expectorant", jp:"去痰薬"},
  {en:"antacid", jp:"制酸薬"},
  {en:"antiemetic", jp:"制吐薬"},
  {en:"laxative", jp:"下剤，緩下剤"},
  {en:"antidiarrheal", jp:"下痢止め，止瀉薬"},
  {en:"digestant", jp:"消化薬"},
  {en:"sedative", jp:"鎮静薬"},
  {en:"tranquilizer", jp:"精神安定剤"},
  {en:"antidepressant", jp:"抗うつ薬"},
  {en:"anticonvulsant", jp:"抗けいれん薬，抗てんかん薬"},
  {en:"anesthetic", jp:"麻酔薬"},
  {en:"general anesthesia", jp:"全身麻酔"},
  {en:"local anesthesia", jp:"局所麻酔"},
  {en:"epidural anesthesia", jp:"硬膜外麻酔"},
  {en:"intramuscular injection", jp:"筋肉注射"},
  {en:"subcutaneous injection", jp:"皮下注射"},
  {en:"intravenous injection", jp:"静脈注射"},
  {en:"disinfectant", jp:"消毒薬"},
  {en:"[hand] sanitizer", jp:"手指消毒薬"},
  {en:"antipruritic", jp:"止痒剤，かゆみ止め"},
  {en:"the pill / oral contraceptive pill (OCP)", jp:"経口避妊薬，ピル"}
];


function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
