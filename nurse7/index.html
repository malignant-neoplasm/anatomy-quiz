<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;

const words = [
  {en:"congenital", jp:"先天性の"},
  {en:"acquired", jp:"後天性の"},
  {en:"acute", jp:"急性の"},
  {en:"chronic", jp:"慢性の"},
  {en:"progressive", jp:"進行性の"},
  {en:"benign", jp:"良性の"},
  {en:"malignant", jp:"悪性の"},
  {en:"contagious", jp:"[接触]感染性の"},
  {en:"degenerative", jp:"徐々に悪くなる、変性の"},
  {en:"drug-induced", jp:"薬剤[誘発]性の、薬物性の"},
  {en:"fatal", jp:"致死[的]な"},
  {en:"intractable", jp:"難治性の"},
  {en:"intravenous", jp:"静脈内の、静脈注射[用]の"},
  {en:"invasive", jp:"侵襲性の"},
  {en:"localized", jp:"限局性の"},
  {en:"palliative", jp:"緩和的な"},
  {en:"transient", jp:"一過性の"},
  {en:"administer", jp:"[薬などを]投与する"},
  {en:"alleviate", jp:"緩和(軽減)する"},
  {en:"diagnose", jp:"診断する"},
  {en:"suffer from", jp:"～に罹患する"},
  {en:"admission / hospitalization", jp:"入院"},
  {en:"discharge", jp:"退院"},
  {en:"ward", jp:"病棟"},
  {en:"intensive care unit [ICU]", jp:"集中治療室"},
  {en:"emergency room [ER]", jp:"救急処置室"},
  {en:"inpatient", jp:"入院患者"},
  {en:"outpatient", jp:"外来患者"},
  {en:"ailment", jp:"[慢性の軽い]病気"},
  {en:"pandemic", jp:"パンデミック，[感染症の全世界的流行】"},
  {en:"complication", jp:"合併症"},
  {en:"infection", jp:"感染[症]"},
  {en:"trauma", jp:"外傷、傷害、損傷"},
  {en:"vital signs", jp:"バイタルサイン、生命徴候"},
  {en:"blood pressure", jp:"血圧"},
  {en:"pulse rate", jp:"脈拍数"},
  {en:"respiratory rate", jp:"呼吸数"},
  {en:"body temperature", jp:"体温"},
  {en:"dose", jp:"1回投与、服用量"},
  {en:"infusion", jp:"輸液、点滴[液]"},
  {en:"transfusion", jp:"輸血"},
  {en:"intubation", jp:"挿管"},
  {en:"prognosis", jp:"[病気の]予後"},
  {en:"relapse", jp:"再発"},
  {en:"remission", jp:"寛解"},
  {en:"incision", jp:"切開[術]"},
  {en:"resection", jp:"切除[術]"},
  {en:"transplantation", jp:"移植[術]"},
  {en:"resuscitation", jp:"蘇生[法]"},
  {en:"chart", jp:"カルテ"},
  {en:"consent", jp:"同意、承認"},
  {en:"prescription", jp:"処方"},
  {en:"malpractice", jp:"医療過誤"},
  {en:"deficiency", jp:"欠乏[症]"},
  {en:"deterioration", jp:"悪化、劣化、退行"},
  {en:"dysfunction", jp:"機能障害、機能不全"},
  {en:"embryo", jp:"胚子、胎芽 (8週末まで)"},
  {en:"fetus", jp:"胎児 (8週末以降)"},
  {en:"newborn [baby] / neonate", jp:"新生児"}
];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
