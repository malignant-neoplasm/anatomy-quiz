<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;

const words = [
  {en:"bone", jp:"骨"},
  {en:"cartilage", jp:"軟骨"},
  {en:"joint", jp:"関節"},
  {en:"ligament", jp:"靱帯"},
  {en:"tendon", jp:"腱"},
  {en:"muscle", jp:"筋肉"},
  {en:"skull / cranium", jp:"頭蓋[骨]"},
  {en:"cheekbone / zygomatic bone", jp:"頬骨"},
  {en:"upper jaw / maxilla", jp:"上顎骨"},
  {en:"lower jaw / mandible", jp:"下顎骨"},
  {en:"hyoid bone", jp:"舌骨"},
  {en:"collarbone / clavicle", jp:"鎖骨"},
  {en:"rib / costa", jp:"肋骨"},
  {en:"pelvis", jp:"骨盤"},
  {en:"sacrum", jp:"仙骨"},
  {en:"hip bone / coxal bone", jp:"寛骨"},
  {en:"iliac bone / ilium", jp:"腸骨"},
  {en:"ischium", jp:"坐骨"},
  {en:"pubic bone / pubis", jp:"恥骨"},
  {en:"coccyx", jp:"尾骨"},
  {en:"spinal column / vertebral column", jp:"脊柱"},
  {en:"backbone / spine", jp:"背骨，脊椎"},
  {en:"cervical vertebrae", jp:"頸椎"},
  {en:"shoulder blade / scapula", jp:"肩甲骨"},
  {en:"acromion", jp:"肩峰"},
  {en:"breastbone / sternum", jp:"胸骨"},
  {en:"thoracic vertebrae", jp:"胸椎"},
  {en:"lumbar vertebrae", jp:"腰椎"},
  {en:"humerus", jp:"上腕骨"},
  {en:"radius", jp:"橈骨"},
  {en:"ulna", jp:"尺骨"},
  {en:"carpal bone", jp:"手根骨"},
  {en:"metacarpal bone", jp:"中手骨"},
  {en:"thighbone / femur", jp:"大腿骨"},
  {en:"kneecap / patella", jp:"膝蓋骨"},
  {en:"fibula", jp:"腓骨"},
  {en:"shin bone / tibia", jp:"脛骨"},
  {en:"tarsal bone", jp:"足根骨"},
  {en:"heel bone / calcaneus", jp:"踵骨"},
  {en:"ankle bone / talus", jp:"距骨"},
  {en:"metatarsal bone", jp:"中足骨"},
  {en:"phalange", jp:"指骨"},
  {en:"knuckle / metacarpophalangeal joint", jp:"中手指節関節"},
  {en:"interphalangeal joint", jp:"指節間関節"},
  {en:"anterior cruciate ligament", jp:"前十字靱帯"},
  {en:"meniscus", jp:"半月板"},
  {en:"Achilles tendon", jp:"アキレス腱"},
  {en:"trapezius", jp:"僧帽筋"},
  {en:"deltoid", jp:"三角筋"},
  {en:"pectoralis major", jp:"大胸筋"},
  {en:"biceps brachii", jp:"上腕二頭筋"},
  {en:"triceps brachii", jp:"上腕三頭筋"},
  {en:"latissimus dorsi", jp:"広背筋"},
  {en:"abs / abdominal muscles", jp:"腹筋"},
  {en:"gluteus maximus", jp:"大臀筋"},
  {en:"psoas", jp:"腸筋"},
  {en:"quadriceps femoris", jp:"大腿四頭筋"},
  {en:"gastrocnemius", jp:"腓腹筋"},
  {en:"soleus", jp:"ヒラメ筋"},
];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
