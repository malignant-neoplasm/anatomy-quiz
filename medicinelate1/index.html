<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;

const words = [
  {en:"chills", jp:"悪寒"},
  {en:"fatigue / lassitude", jp:"疲労感"},
  {en:"fever / pyrexia", jp:"熱，発熱"},
  {en:"malaise", jp:"倦怠感，不定愁訴"},
  {en:"distress", jp:"苦しい状態"},
  {en:"dehydration", jp:"脱水"},
  {en:"swelling", jp:"腫脹，膨化"},
  {en:"edema", jp:"浮腫"},
  {en:"sleep deprivation", jp:"睡眠不足"},
  {en:"lymphadenopathy", jp:"リンパ節腫脹"},
  {en:"lymphedema", jp:"リンパ浮腫"},
  {en:"lump", jp:"しこり，塊"},
  {en:"ache / pain", jp:"痛み，疼痛"},
  {en:"colic", jp:"疝痛"},
  {en:"throbbing pain / pulsating pain", jp:"拍動痛"},
  {en:"tenderness", jp:"圧痛"},
  {en:"penetrating pain", jp:"突き刺すような痛み"},
  {en:"stabbing pain", jp:"ナイフで刺されるような痛み"},
  {en:"squeezing pain", jp:"締め付けられるような痛み"},
  {en:"bleeding / hemorrhage", jp:"出血"},
  {en:"anemia", jp:"貧血"},
  {en:"sepsis", jp:"敗血症"},
  {en:"leprosy", jp:"ハンセン病"},
  {en:"diphtheria", jp:"ジフテリア"},
  {en:"whooping cough / pertussis", jp:"百日咳"},
  {en:"lockjaw / tetanus", jp:"破傷風"},
  {en:"typhoid fever", jp:"腸チフス"},

  {en:"cholera", jp:"コレラ"},
  {en:"Lyme disease", jp:"ライム病"},
  {en:"Scarlet fever", jp:"猩紅熱"},
  {en:"rheumatic fever", jp:"リウマチ熱"},
  {en:"poliomyelitis", jp:"ポリオ，灰白髄炎"},
  {en:"rabies", jp:"狂犬病"},
  {en:"coronavirus disease [COVID-19]", jp:"新型コロナウイルス感染症"},
  {en:"three-day measles / rubella", jp:"風疹"},
  {en:"measles", jp:"麻疹，はしか"},
  {en:"chickenpox / varicella", jp:"水痘，水疱瘡"},
  {en:"mumps / epidemic parotitis", jp:"流行性耳下腺炎，おたふく風邪"},
  {en:"hand-foot-and-mouth disease", jp:"手足口病"},
  {en:"exanthema subitum", jp:"突発性発疹"},
  {en:"erythema infectiosum", jp:"伝染性紅斑，リンゴ病"},
  {en:"Ebola hemorrhagic fever", jp:"エボラ出血熱"},
  {en:"dengue fever", jp:"デング熱"},
  {en:"malaria", jp:"マラリア"},

  {en:"amebic dysentery", jp:"アメーバ赤痢"},
  {en:"yeast infection / candidiasis", jp:"カンジダ症"},
  {en:"sexually transmitted disease [STD]", jp:"性感染症"},
  {en:"syphilis", jp:"梅毒"},
  {en:"the clap / gonorrhea", jp:"淋菌感染症，淋病"},
  {en:"human papilloma virus (HPV)", jp:"ヒトパピローマウイルス"},
  {en:"human immunodeficiency virus (HIV)", jp:"ヒト免疫不全ウイルス"},
  {en:"acquired immunodeficiency syndrome [AIDS]", jp:"エイズ，後天性免疫不全症候群"},
  {en:"cerebral palsy", jp:"脳性麻痺"},
  {en:"Down syndrome", jp:"ダウン症候群"},
  {en:"epilepsy", jp:"てんかん"},
  {en:"febrile seizure", jp:"熱性けいれん"},
  {en:"respiratory syncytial virus infection", jp:"RSウイルス感染症"},
  {en:"sudden infant death syndrome [SIDS]", jp:"乳幼児突然死症候群"},
  {en:"heatstroke", jp:"熱中症"},
];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
