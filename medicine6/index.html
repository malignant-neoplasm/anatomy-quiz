<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
}

/* ===== リスト（1列固定） ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: center;
  gap: 10px;

  padding: 14px;
  border-radius: 14px;
  background: #fff;

  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
}

/* ===== 答え ===== */
.a {
  min-width: 110px;
  max-width: 40%;
  height: 32px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 0.85em;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 表示 */
.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

/* PCホバー */
.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* 音声ボタン */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
}
.a {
  width: 140px;        /* ← 固定 */
  min-width: 140px;
  max-width: 140px;

  height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 0.8em;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-shrink: 0;      /* ← これ超重要 */
}
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;

  background: #1976d2 !important;
  color: #fff !important;

  font-weight: bold;
  font-size: 0.9em;

  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important; /* シャッフル */
}

.btn:nth-child(3) {
  background: #757575 !important; /* 標準順 */
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)" style="background:#666;">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>

let isEnglishMode = true;

const words = [
  {en:"congenital", jp:"先天性の"},
  {en:"acquired", jp:"後天性の"},
  {en:"acute", jp:"急性の"},
  {en:"chronic", jp:"慢性の"},
  {en:"progressive", jp:"進行性の"},
  {en:"progression", jp:"進行"},
  {en:"benign", jp:"良性の"},
  {en:"malignant", jp:"悪性の"},
  {en:"infectious", jp:"感染性の"},
  {en:"contagious", jp:"[接触]感染性の"},
  {en:"degenerative", jp:"変性の"},
  {en:"drug-induced", jp:"薬剤[誘発]性の"},
  {en:"fatal", jp:"致死[的]な"},
  {en:"intractable", jp:"難治性の"},
  {en:"invasive", jp:"侵襲性の"},
  {en:"localized", jp:"限局性の"},
  {en:"palliative", jp:"緩和的な"},
  {en:"transient", jp:"一過性の"},
  {en:"bilateral", jp:"両側性の"},
  {en:"unilateral", jp:"片側性の"},
  {en:"asymptomatic", jp:"無症状の"},
  {en:"febrile", jp:"発熱[性]の"},
  {en:"intermittent", jp:"間欠性の"},
  {en:"purulent", jp:"膿性の"},
  {en:"administer", jp:"[薬などを]投与する"},
  {en:"alleviate", jp:"緩和(軽減)する"},
  {en:"diagnose", jp:"診断する"},
  {en:"diagnosis", jp:"診断"},
  {en:"suffer from", jp:"～に罹患する"},
  {en:"consent", jp:"同意，承認"},
  {en:"referral", jp:"紹介[状]"},
  {en:"admission / hospitalization", jp:"入院"},
  {en:"discharge", jp:"退院"},
  {en:"ward", jp:"病棟"},
  {en:"intensive care unit (ICU)", jp:"集中治療室"},
  {en:"emergency room (ER)", jp:"救急処置室"},
  {en:"operating room (OR)", jp:"手術室"},
  {en:"inpatient", jp:"入院患者"},
  {en:"outpatient", jp:"外来患者"},
  {en:"medical record / chart", jp:"カルテ，診療記録"},
  {en:"prescription", jp:"処方[箋]"},
  {en:"malpractice", jp:"医療過誤"},
  {en:"medical certificate", jp:"診断書"},
  {en:"vital signs", jp:"バイタルサイン，生命徴候"},
  {en:"blood pressure", jp:"血圧"},
  {en:"pulse rate", jp:"脈拍数"},
  {en:"respiratory rate", jp:"呼吸数"},
  {en:"body temperature", jp:"体温"},
  {en:"inhale / inspire", jp:"[息を]吸う"},
  {en:"exhale / expire", jp:"[息を]吐く"},
  {en:"circulation", jp:"循環"},
  {en:"digestion", jp:"消化"},
  {en:"excretion", jp:"排泄"},
  {en:"metabolism", jp:"代謝"},
  {en:"dose", jp:"1回投与，服用量"},
  {en:"saline / solution", jp:"生理食塩水"},
  {en:"infusion", jp:"輸液，点滴[液]"},
  {en:"transfusion", jp:"輸血"},
  {en:"hemostasis", jp:"止血"},
  {en:"intravenous", jp:"静脈内の，静脈注射[用]の"},
  {en:"intubation", jp:"挿管"},
  {en:"side effect", jp:"副作用"},
  {en:"culture", jp:"培養"},
  {en:"tolerance", jp:"耐症"},
  {en:"resistance", jp:"耐症"},
  {en:"bacteria", jp:"細菌"},
  {en:"virus", jp:"ウイルス"},
  {en:"coccus (pl. cocci)", jp:"球菌"},
  {en:"staphylococcus", jp:"ブドウ球菌"},
  {en:"streptococcus", jp:"レンサ球菌"},
  {en:"bacillus (pl. bacilli)", jp:"桿菌"},
  {en:"incision", jp:"切開[術]"},
  {en:"resection", jp:"切除[術]"},
  {en:"transplantation", jp:"移植[術]"},
  {en:"resuscitation", jp:"蘇生[法]"},
  {en:"suture", jp:"縫合，縫合糸"},
  {en:"prone position", jp:"伏臥位"},
  {en:"supine position", jp:"仰臥位"},
  {en:"intervention", jp:"[治療的]介入"}
];


// シャッフル
function shuffle(arr){
  for(let i = arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 音声
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

// 切替
function toggleMode(){
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

// 描画
function render(doShuffle){
  let list = [...words];
  if(doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w=>{
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;

    html += `
      <li class="item" onclick="this.classList.toggle('marked')">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${w.en}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);

</script>

</body>
</html>
