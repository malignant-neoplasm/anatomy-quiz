<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;
const words = [
  {en:"[vaginal] discharge", jp:"おりもの"},
  {en:"period / mense / menstruation / menorrhea", jp:"月経，生理"},
  {en:"menarche", jp:"初潮，初経"},
  {en:"menstrual cycle", jp:"月経周期"},
  {en:"cramps", jp:"生理痛"},
  {en:"menopause", jp:"閉経"},
  {en:"hot flashes", jp:"ほてり"},
  {en:"menopausal disorder", jp:"更年期障害"},
  {en:"irregular period", jp:"月経不順"},
  {en:"premenstrual syndrome [PMS]", jp:"月経前症候群"},
  {en:"dysmenorrhea", jp:"月経困難症"},
  {en:"polymenorrhea", jp:"頻発月経"},
  {en:"hypermenorrhea", jp:"過多月経"},
  {en:"oligomenorrhea", jp:"希発月経"},
  {en:"amenorrhea", jp:"無月経"},
  {en:"irregular bleeding / abnormal uterine bleeding", jp:"不正性器出血"},
  {en:"cervical cancer", jp:"子宮頸癌"},
  {en:"uterine fibroid / uterine leiomyoma", jp:"子宮筋腫"},
  {en:"endometrial cancer", jp:"子宮体がん"},
  {en:"endometriosis", jp:"子宮内膜症"},

  {en:"endometritis", jp:"子宮内膜炎"},
  {en:"ovarian cancer", jp:"卵巣がん"},
  {en:"ovarian cyst", jp:"卵巣嚢腫"},
  {en:"vaginitis", jp:"膣炎"},
  {en:"breast cancer", jp:"乳癌"},
  {en:"mastitis", jp:"乳腺炎"},
  {en:"fibroadenoma", jp:"線維腺腫"},
  {en:"infertility", jp:"不妊症"},
  {en:"pregnancy / gestation", jp:"妊娠[状態]"},
  {en:"gravida / gravidity", jp:"妊娠回数"},
  {en:"para / parity", jp:"出産回数"},
  {en:"trimester", jp:"妊娠期，三半期"},
  {en:"due date / estimated date of delivery [EDD]", jp:"分娩予定日"},
  {en:"morning sickness / hyperemesis gravidarum", jp:"妊娠悪阻，つわり"},
  {en:"multiple gestation (pregnancy)", jp:"多胎妊娠"},
  {en:"ectopic pregnancy", jp:"異所性妊娠"},
  {en:"gestational hypertension / pregnancy-induced hypertension [PIH]", jp:"妊娠高血圧症候群"},

  {en:"eclampsia", jp:"子癇"},
  {en:"rupture of membranes / amniorrhexis", jp:"破水，破膜"},
  {en:"labor pains / labor contractions", jp:"分娩，陣痛"},
  {en:"delivery / parturition", jp:"出産，分娩"},
  {en:"premature birth / preterm birth", jp:"早産"},
  {en:"miscarriage / spontaneous abortion", jp:"流産"},
  {en:"[induced] abortion", jp:"[人工妊娠]中絶"},
  {en:"[labor] dystocia", jp:"難産"},
  {en:"stillbirth", jp:"死産"},
  {en:"placenta previa", jp:"前置胎盤"},
  {en:"placental abruption", jp:"常位胎盤早期剝離"},
  {en:"postpartum infection", jp:"産褥感染症"},
  {en:"breastfeeding", jp:"授乳"},
  {en:"contraceptive", jp:"避妊具"},
  {en:"intrauterine device [IUD]", jp:"子宮内避妊器具"},
  {en:"artificial insemination", jp:"人工授精"},
  {en:"in vitro fertilization [IVF]", jp:"体外受精"},
  {en:"C-section / cesarean section", jp:"帝王切開[術]"},

  {en:"hysterectomy", jp:"子宮摘出[術]"},
  {en:"mastectomy", jp:"乳房切除[術]"}
];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
