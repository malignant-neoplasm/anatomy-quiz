<meta charset="UTF-8">

<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<div id="quiz">

    <button class="btn" onclick="render(true)">🔀 シャッフル</button>

  <ul id="list" class="list"></ul>
</div>

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>
