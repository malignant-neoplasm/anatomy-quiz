<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;

const words = [
  {en:"ailment", jp:"[慢性の軽い]病気"},
  {en:"trauma", jp:"外傷，傷害，損傷"},
  {en:"onset", jp:"発症，発現"},
  {en:"lesion", jp:"病変，病巣"},
  {en:"inflammation", jp:"炎症"},
  {en:"necrosis", jp:"壊死"},
  {en:"obstruction", jp:"閉塞[症]"},
  {en:"clot[ting] / coagulation", jp:"凝固[作用]"},
  {en:"accumulation", jp:"蓄積"},
  {en:"dysfunction", jp:"機能障害，機能不全"},
  {en:"deficiency", jp:"欠乏[症]"},
  {en:"deterioration", jp:"悪化，退行"},
  {en:"exacerbation / flare-up", jp:"増悪"},
  {en:"relapse", jp:"再発"},
  {en:"remission", jp:"寛解"},
  {en:"prognosis", jp:"[病気の]予後"},
  {en:"complication", jp:"合併症"},
  {en:"sequela", jp:"後遺症"},
  {en:"prevalence", jp:"有病率"},
  {en:"incidence", jp:"発生[数，率]"},
  {en:"mortality [rate]", jp:"死亡[率]"},
  {en:"life expectancy", jp:"平均余命"},
  {en:"pandemic", jp:"パンデミック，感染症の全世界的流行"},
  {en:"tumor", jp:"腫瘍，腫瘤"},
  {en:"neoplasm", jp:"新生物，腫瘍"},
  {en:"metastasis", jp:"転移"},
  {en:"carcinogen", jp:"発がん物質"},
  {en:"vaccination / immunization", jp:"予防接種"},
  {en:"vaccine", jp:"ワクチン"},
  {en:"antibody", jp:"抗体"},
  {en:"immunity", jp:"免疫[力]"},
  {en:"infection", jp:"感染[症]"},
  {en:"hemolysis", jp:"溶血"},
  {en:"tick", jp:"マダニ"},
  {en:"mite", jp:"ダニ"},
  {en:"lice", jp:"シラミ"},
  {en:"flea", jp:"ノミ"},
  {en:"mosquito", jp:"蚊"},
  {en:"cell", jp:"細胞"},
  {en:"gene", jp:"遺伝子"},
  {en:"genetic", jp:"遺伝[子]の"},
  {en:"variant", jp:"変異体"},
  {en:"tissue", jp:"組織"},
  {en:"membrane", jp:"膜"},
  {en:"fluid", jp:"液体，体液"},
  {en:"secretion", jp:"分泌[物]"},
  {en:"mucus", jp:"粘液"},
  {en:"saliva", jp:"唾液"},
  {en:"hormone", jp:"ホルモン"},
  {en:"fat / lipid", jp:"脂肪"},
  {en:"visceral adipose", jp:"内臓脂肪"},
  {en:"pee / urine", jp:"尿"},
  {en:"urinate", jp:"排尿する"},
  {en:"feces / stool", jp:"大便"},
  {en:"bowel movement / defecation", jp:"排便，便通"},
  {en:"defecate", jp:"排便する"},
  {en:"nerve", jp:"神経"},
  {en:"reflex", jp:"反射"},
  {en:"central nervous system (CNS)", jp:"中枢神経系"},
  {en:"peripheral nervous system (PNS)", jp:"末梢神経系"},
  {en:"sympathetic nerve", jp:"交感神経"},
  {en:"parasympathetic nerve", jp:"副交感神経"},
  {en:"olfactory nerve", jp:"嗅神経"},
  {en:"optic nerve", jp:"視神経"},
  {en:"trigeminal nerve", jp:"三叉神経"},
  {en:"embryo", jp:"胚子，胎芽（8週末まで）"},
  {en:"fetus", jp:"胎児（8週末以降）"},
  {en:"newborn [baby] / neonate", jp:"新生児"},
  {en:"infant", jp:"乳児（生後1年まで）"},
  {en:"preschooler", jp:"幼児（就学前の小児）"},
  {en:"malnutrition", jp:"低栄養"},
  {en:"obesity", jp:"肥満[症]"},
  {en:"addiction", jp:"依存症，中毒"},
  {en:"intoxication", jp:"中毒"},
  {en:"toxic", jp:"有毒な"},
  {en:"cadaver", jp:"死体"},
  {en:"empathy", jp:"共感，感情移入"}
];

必要なら次に、このデータをそのまま入れた完成HTML版も作る。


function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
