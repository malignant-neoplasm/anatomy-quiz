<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;

const words = [
  {en:"anuria", jp:"無尿[症]"},
  {en:"polyuria", jp:"多尿[症]"},
  {en:"oliguria", jp:"乏尿"},
  {en:"nocturia", jp:"夜間頻尿"},
  {en:"dysuria", jp:"排尿困難"},
  {en:"bed-wetting / [nocturnal] enuresis", jp:"夜尿[症]"},
  {en:"incontinence", jp:"失禁"},
  {en:"bloody urine / hematuria", jp:"血尿"},
  {en:"nephritis", jp:"腎炎"},
  {en:"glomerulonephritis", jp:"糸球体腎炎"},
  {en:"pyelonephritis", jp:"腎盂腎炎"},
  {en:"renal (kidney) failure", jp:"腎不全"},
  {en:"acute kidney injury [AKI]", jp:"急性腎障害"},
  {en:"chronic kidney disease [CKD]", jp:"慢性腎臓病"},
  {en:"kidney cancer / renal cell carcinoma", jp:"腎細胞癌（腎臓がん）"},
  {en:"kidney stone / renal calculus / nephrolithiasis", jp:"腎結石"},
  {en:"nephrotic syndrome", jp:"ネフローゼ症候群"},
  {en:"diabetic nephropathy", jp:"糖尿病腎症"},
  {en:"hydronephrosis", jp:"水腎症"},

  {en:"diabetes insipidus", jp:"尿崩症"},
  {en:"hyperuricemia", jp:"高尿酸血症"},
  {en:"urinary tract infection [UTI]", jp:"尿路感染症"},
  {en:"urethritis", jp:"尿道炎"},
  {en:"urinary stone / urinary calculus / ureterolithiasis", jp:"尿路結石"},
  {en:"cystitis", jp:"膀胱炎"},
  {en:"[urinary] bladder cancer", jp:"膀胱がん"},
  {en:"overactive bladder", jp:"過活動膀胱"},
  {en:"prostatic cancer", jp:"前立腺がん"},
  {en:"enlarged prostate / [benign] prostatic hyperplasia", jp:"前立腺肥大[症]"},
  {en:"prostatitis", jp:"前立腺炎"},
  {en:"erectile dysfunction [ED]", jp:"勃起不全"},
  {en:"orchitis", jp:"精巣炎"},
  {en:"testicular cancer", jp:"精巣腫瘍"},
  {en:"phimosis", jp:"包茎"},
  {en:"cryptorchidism", jp:"停留精巣"},
  {en:"urinary catheterization", jp:"導尿"},

  {en:"dialysis", jp:"透析"},
  {en:"hemodialysis", jp:"血液透析"},
  {en:"peritoneal dialysis", jp:"腹膜透析"},
  {en:"lithotripsy", jp:"体外衝撃波結石破砕術"},
  {en:"nephrectomy", jp:"腎摘出術"},
  {en:"vasectomy", jp:"精管切除術（パイプカット）"},
  {en:"prostatectomy", jp:"前立腺摘除術"},
  {en:"collagen disease", jp:"膠原病"},
  {en:"scleroderma", jp:"強皮症"},
  {en:"systemic lupus erythematosus [SLE]", jp:"全身性エリテマトーデス"},
  {en:"polymyositis", jp:"多発性筋炎"},
  {en:"rheumatoid arthritis [RA]", jp:"関節リウマチ"},
  {en:"gout", jp:"痛風"},
  {en:"Behçet's disease", jp:"ベーチェット病"},
  {en:"fibromyalgia", jp:"線維筋痛症"},

  {en:"allergy", jp:"アレルギー"},
  {en:"anaphylaxis", jp:"アナフィラキシー"},
  {en:"allergen", jp:"アレルゲン"},
  {en:"allergic rhinitis", jp:"アレルギー性鼻炎"},
  {en:"allergic conjunctivitis", jp:"アレルギー性結膜炎"},
  {en:"contact dermatitis", jp:"接触皮膚炎，かぶれ"},
  {en:"atopic dermatitis", jp:"アトピー性皮膚炎"},
  {en:"epinephrine autoinjector", jp:"エピネフリン自己注射薬（エピペン）"}
];


function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
