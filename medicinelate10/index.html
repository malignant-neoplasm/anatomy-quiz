<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;
const words = [
  {en:"vision / visual acuity [VA]", jp:"視力"},
  {en:"eye discharge", jp:"眼脂，目やに"},
  {en:"eye pain / ophthalmalgia", jp:"眼痛"},
  {en:"itchy eyes / eye irritation", jp:"眼の刺激感，目のかゆみ"},
  {en:"blurry / blurred vision", jp:"かすみ目"},
  {en:"nystagmus", jp:"眼振"},
  {en:"blindness", jp:"失明"},
  {en:"near-sightedness / myopia", jp:"近視"},
  {en:"far-sightedness / hyperopia", jp:"遠視"},
  {en:"astigmatism", jp:"乱視"},
  {en:"crossed eye / strabismus", jp:"斜視"},
  {en:"presbyopia", jp:"老視，老眼"},
  {en:"double vision / diplopia", jp:"複視"},
  {en:"lazy eye / amblyopia", jp:"弱視"},
  {en:"color blindness", jp:"色覚異常"},
  {en:"photophobia", jp:"羞明"},
  {en:"floaters", jp:"飛蚊症"},
  {en:"ptosis", jp:"眼瞼下垂"},
  {en:"eyestrain / asthenopia", jp:"眼精疲労"},

  {en:"dry eye syndrome", jp:"ドライアイ[症候群]"},
  {en:"pink eye / conjunctivitis", jp:"結膜炎"},
  {en:"keratoconjunctivitis", jp:"角結膜炎"},
  {en:"stye", jp:"麦粒腫，ものもらい"},
  {en:"chalazion", jp:"霰粒腫"},
  {en:"cataract", jp:"白内障"},
  {en:"glaucoma", jp:"緑内障"},
  {en:"retinal detachment [RD]", jp:"網膜剥離"},
  {en:"uveitis", jp:"ぶどう膜炎"},
  {en:"keratitis", jp:"角膜炎"},
  {en:"diabetic retinopathy", jp:"糖尿病網膜症"},
  {en:"macular degeneration", jp:"黄斑変性"},
  {en:"laser-assisted in situ keratomileusis [LASIK]", jp:"レーシック，レーザー角膜屈折矯正術"},

  {en:"earwax / cerumen", jp:"耳垢"},
  {en:"buzzing / ringing / tinnitus", jp:"耳鳴り，耳鳴"},
  {en:"earache / otalgia", jp:"耳痛"},
  {en:"otorrhea", jp:"耳漏"},
  {en:"hearing loss", jp:"難聴"},
  {en:"deafness", jp:"聾"},
  {en:"otitis externa", jp:"外耳炎"},
  {en:"otitis media", jp:"中耳炎"},
  {en:"otitis interna", jp:"内耳炎"},
  {en:"Ménière's disease", jp:"メニエール病"},
  {en:"cochlear implant", jp:"人工内耳"},

  {en:"toothache / odontalgia", jp:"歯痛"},
  {en:"halitosis", jp:"口臭"},
  {en:"cavity / caries", jp:"う蝕，虫歯"},
  {en:"gingivitis", jp:"歯肉炎"},
  {en:"periodontitis", jp:"歯周炎"},
  {en:"alveolar abscess", jp:"歯槽膿瘍"},
  {en:"stomatitis", jp:"口内炎"},
  {en:"bad bite / malocclusion", jp:"不正咬合"},
  {en:"temporomandibular disorder", jp:"顎関節症"},
  {en:"cleft lip / palate", jp:"口唇口蓋裂"},
  {en:"tooth extraction", jp:"抜歯"},
  {en:"orthodontic treatment / braces", jp:"歯列矯正"},
  {en:"dental implant", jp:"インプラント"}
];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
