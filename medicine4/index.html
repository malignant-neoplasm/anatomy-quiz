<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
}

/* ===== リスト（1列固定） ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: center;
  gap: 10px;

  padding: 14px;
  border-radius: 14px;
  background: #fff;

  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
}

/* ===== 答え ===== */
.a {
  min-width: 110px;
  max-width: 40%;
  height: 32px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 0.85em;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 表示 */
.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

/* PCホバー */
.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* 音声ボタン */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
}
.a {
  width: 140px;        /* ← 固定 */
  min-width: 140px;
  max-width: 140px;

  height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 0.8em;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-shrink: 0;      /* ← これ超重要 */
}
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;

  background: #1976d2 !important;
  color: #fff !important;

  font-weight: bold;
  font-size: 0.9em;

  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important; /* シャッフル */
}

.btn:nth-child(3) {
  background: #757575 !important; /* 標準順 */
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)" style="background:#666;">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>

let isEnglishMode = true;

const words = [
{en:"nasal cavity", jp:"鼻腔"},
{en:"oral cavity", jp:"口腔"},
{en:"hard palate", jp:"硬口蓋"},
{en:"soft palate", jp:"軟口蓋"},
{en:"uvula", jp:"口蓋垂"},
{en:"larynx", jp:"喉頭"},
{en:"thyroid gland", jp:"甲状腺"},
{en:"vocal cords", jp:"声帯"},
{en:"glottis", jp:"声門"},
{en:"epiglottis", jp:"喉頭蓋"},
{en:"windpipe / trachea", jp:"気管"},
{en:"bronchus (pl. bronchi)", jp:"気管支"},
{en:"bronchiole", jp:"細気管支"},
{en:"alveolus (pl. alveoli)", jp:"肺胞"},
{en:"lung", jp:"肺"},
{en:"diaphragm", jp:"横隔膜"},
{en:"pharynx", jp:"咽頭"},
{en:"esophagus", jp:"食道"},
{en:"stomach", jp:"胃"},
{en:"cardia", jp:"噴門"},
{en:"pylorus", jp:"幽門"},
{en:"small intestine", jp:"小腸"},
{en:"duodenum", jp:"十二指腸"},
{en:"jejunum", jp:"空腸"},
{en:"ileum", jp:"回腸"},
{en:"large intestine", jp:"大腸"},
{en:"colon", jp:"結腸"},
{en:"ascending colon", jp:"上行結腸"},
{en:"transverse colon", jp:"横行結腸"},
{en:"descending colon", jp:"下行結腸"},
{en:"sigmoid colon", jp:"S状結腸"},
{en:"cecum", jp:"盲腸"},
{en:"appendix", jp:"虫垂"},
{en:"rectum", jp:"直腸"},
{en:"anus", jp:"肛門"},
{en:"liver", jp:"肝臓"},
{en:"gallbladder", jp:"胆嚢"},
{en:"bile duct", jp:"胆管"},
{en:"pancreas", jp:"膵臓"},
{en:"spleen", jp:"脾臓"},
{en:"gut / bowel / intestine", jp:"腸，消化管"},
{en:"kidney", jp:"腎臓"},
{en:"adrenal gland", jp:"副腎"},
{en:"ureter", jp:"尿管"},
{en:"urinary bladder", jp:"膀胱"},
{en:"urethra", jp:"尿道"},
{en:"seminal vesicle", jp:"精嚢"},
{en:"prostate gland", jp:"前立腺"},
{en:"penis", jp:"陰茎"},
{en:"testis", jp:"精巣"},
{en:"sperm", jp:"精子"},
{en:"ovary", jp:"卵巣"},
{en:"ovum", jp:"卵，卵子"},
{en:"fallopian tube", jp:"卵管"},
{en:"womb / uterus", jp:"子宮"},
{en:"uterine cervix", jp:"子宮頸部"},
{en:"corpus uteri", jp:"子宮体部"},
{en:"endometrium", jp:"子宮内膜"},
{en:"perimetrium", jp:"子宮外膜"},
{en:"myometrium", jp:"子宮筋層"},
{en:"vagina", jp:"膣"},
{en:"placenta", jp:"胎盤"},
{en:"umbilical cord", jp:"臍帯"},
{en:"amnion", jp:"羊膜"},
{en:"amniotic fluid", jp:"羊水"},
{en:"diet therapy", jp:"食事療法"},
{en:"symptomatic therapy", jp:"対症療法"},
{en:"chemotherapy", jp:"化学療法"},
{en:"radiotherapy / radiation therapy", jp:"放射線治療"},
{en:"palliative therapy", jp:"緩和療法"},
{en:"immunotherapy", jp:"免疫療法"},
{en:"pharmacotherapy", jp:"薬物療法"},
{en:"psychotherapy", jp:"心理療法"},
{en:"physical therapy", jp:"理学療法"},
{en:"occupational therapy", jp:"作業療法"},
{en:"alternative medicine", jp:"代替医療"}
];



// シャッフル
function shuffle(arr){
  for(let i = arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 音声
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

// 切替
function toggleMode(){
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

// 描画
function render(doShuffle){
  let list = [...words];
  if(doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w=>{
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;

    html += `
      <li class="item" onclick="this.classList.toggle('marked')">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${w.en}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);

</script>

</body>
</html>
