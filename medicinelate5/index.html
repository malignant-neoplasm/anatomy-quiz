<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;

const words = [
  {en:"stomachache / gastralgia", jp:"胃痛"},
  {en:"appetite loss / anorexia", jp:"食欲不振"},
  {en:"hyperphagia", jp:"食欲亢進"},
  {en:"hyperacidity", jp:"胃酸過多症"},
  {en:"indigestion / dyspepsia", jp:"消化不良"},
  {en:"heartburn", jp:"胸やけ"},
  {en:"nausea", jp:"吐き気，悪心"},
  {en:"vomiting / emesis", jp:"嘔吐"},
  {en:"hematemesis", jp:"吐血"},
  {en:"dysphagia", jp:"嚥下困難（障害）"},
  {en:"belch / burp", jp:"げっぷ，おくび"},
  {en:"hiccup", jp:"しゃっくり"},
  {en:"drooling", jp:"よだれ[を垂らす]"},
  {en:"loose bowels / diarrhea", jp:"下痢"},
  {en:"constipation", jp:"便秘"},
  {en:"bloody stool (feces) / hematochezia", jp:"血便"},
  {en:"melena", jp:"黒色便"},
  {en:"gas / flatus", jp:"おなら"},
  {en:"stomach cramps / gastrospasm", jp:"胃痙攣"},
  {en:"abdominal distention", jp:"腹部膨満"},
  {en:"bloating", jp:"[腹部]膨満"},
  {en:"tenesmus", jp:"しぶり腹"},
  {en:"gastroesophageal reflux disease [GERD]", jp:"胃食道逆流症"},
  {en:"esophagitis", jp:"食道炎"},
  {en:"esophageal cancer", jp:"食道癌"},
  {en:"esophageal varices", jp:"食道静脈瘤"},
  {en:"functional dyspepsia", jp:"機能性ディスペプシア"},

  {en:"gastritis", jp:"胃炎"},
  {en:"gastroenteritis", jp:"胃腸炎"},
  {en:"gastric (stomach) cancer", jp:"胃癌"},
  {en:"gastric dilation / gastrectasis", jp:"胃拡張"},
  {en:"gastroptosis", jp:"胃下垂"},
  {en:"gastric ulcer", jp:"胃潰瘍"},
  {en:"peptic ulcer", jp:"消化性潰瘍"},
  {en:"duodenal ulcer", jp:"十二指腸潰瘍"},
  {en:"enteritis", jp:"腸炎"},
  {en:"colorectal cancer", jp:"結腸（大腸）癌"},
  {en:"inflammatory bowel disease [IBD]", jp:"炎症性腸疾患"},
  {en:"Crohn disease", jp:"クローン病"},
  {en:"ulcerative colitis", jp:"潰瘍性大腸炎"},
  {en:"diverticulitis", jp:"憩室炎"},
  {en:"irritable bowel syndrome [IBS]", jp:"過敏性腸症候群"},
  {en:"volvulus", jp:"腸捻転"},
  {en:"bowel obstruction / ileus", jp:"イレウス，腸閉塞"},
  {en:"inguinal hernia", jp:"鼠径ヘルニア"},

  {en:"appendicitis", jp:"虫垂炎"},
  {en:"peritonitis", jp:"腹膜炎"},
  {en:"ascites", jp:"腹水"},
  {en:"hepatitis", jp:"肝炎"},
  {en:"cirrhosis", jp:"肝硬変"},
  {en:"hepatic (liver) failure", jp:"肝不全"},
  {en:"fatty liver / hepatic steatosis", jp:"脂肪肝"},
  {en:"hepatic (liver) cancer", jp:"肝がん"},
  {en:"cholangitis", jp:"胆管炎"},
  {en:"cholelithiasis", jp:"胆石症"},
  {en:"cholecystitis", jp:"胆嚢炎"},
  {en:"pancreatitis", jp:"膵[臓]炎"},
  {en:"pancreatic cancer", jp:"膵[臓]がん"},
  {en:"pile / hemorrhoid", jp:"痔核，いぼ痔"},
  {en:"anal fissure", jp:"裂肛，切れ痔"},
  {en:"anal fistula", jp:"痔瘻"},
  {en:"appendectomy", jp:"虫垂切除"},
  {en:"cholecystectomy", jp:"胆嚢切除"},
  {en:"colostomy", jp:"人工肛門造設術"}
];


function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
