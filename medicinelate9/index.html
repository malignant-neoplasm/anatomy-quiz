<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;
const words = [
  {en:"wound", jp:"創傷，傷"},
  {en:"cut / incised wound", jp:"切創，きりきず"},
  {en:"abrasion", jp:"擦過傷"},
  {en:"laceration", jp:"裂傷，裂創"},
  {en:"bruise", jp:"打ち身，打撲傷"},
  {en:"bump", jp:"こぶ"},
  {en:"burns", jp:"熱傷，やけど"},
  {en:"erosion", jp:"びらん，ただれ"},
  {en:"crust / scab", jp:"痂皮，かさぶた"},
  {en:"scale", jp:"鱗屑"},
  {en:"scar", jp:"瘢痕"},
  {en:"keloid", jp:"ケロイド"},
  {en:"wrinkle", jp:"しわ"},
  {en:"freckle", jp:"雀卵斑，そばかす"},
  {en:"callus", jp:"胼胝，たこ"},
  {en:"corns", jp:"魚の目"},
  {en:"macule", jp:"斑"},

  {en:"flushed skin / erythema", jp:"紅斑"},
  {en:"purpura", jp:"紫斑"},
  {en:"papule", jp:"丘疹"},
  {en:"nodule", jp:"結節"},
  {en:"itchiness / pruritus", jp:"かゆみ，掻痒[症]"},
  {en:"eczema", jp:"湿疹"},
  {en:"dermatitis", jp:"皮膚炎"},
  {en:"rash / eruption", jp:"発疹，皮疹"},
  {en:"wheal", jp:"膨疹"},
  {en:"hives / urticaria", jp:"蕁麻疹"},
  {en:"drug eruption", jp:"薬疹"},
  {en:"prurigo", jp:"痒疹"},
  {en:"heat rash", jp:"汗疹，あせも"},
  {en:"impetigo", jp:"膿痂疹，とびひ"},
  {en:"pus", jp:"膿"},
  {en:"pustule", jp:"膿疱"},
  {en:"cyst", jp:"嚢胞"},
  {en:"abscess", jp:"膿瘍"},
  {en:"blister", jp:"水疱，疱疹"},

  {en:"vesicle", jp:"小水疱"},
  {en:"pimple / acne [vulgaris]", jp:"尋常性ざ瘡，にきび"},
  {en:"boil", jp:"癤，おでき"},
  {en:"wart / verruca", jp:"疣贅，いぼ"},
  {en:"epidermoid cyst", jp:"粉瘤，アテローム"},
  {en:"psoriasis", jp:"乾癬"},
  {en:"keratosis", jp:"角化症"},
  {en:"bedsore / pressure ulcer", jp:"褥瘡，床ずれ"},
  {en:"herpes simplex", jp:"単純ヘルペス"},
  {en:"shingles / herpes zoster", jp:"帯状疱疹"},
  {en:"cellulitis / phlegmon", jp:"蜂窩織炎"},
  {en:"ringworm / tinea", jp:"白癬"},
  {en:"athlete's foot", jp:"足白癬，水虫"},
  {en:"jock itch / tinea cruris", jp:"股部白癬，いんきんたむし"},
  {en:"scabies", jp:"疥癬"},
  {en:"chilblain[s]", jp:"凍瘡，しもやけ"},
  {en:"frostbite", jp:"凍傷"},

  {en:"gangrene", jp:"壊疽"},
  {en:"alopecia", jp:"脱毛症"},
  {en:"hyperhidrosis", jp:"多汗症"},
  {en:"[malignant] melanoma", jp:"悪性黒色腫，メラノーマ"},
  {en:"squamous cell carcinoma", jp:"有棘細胞癌，扁平上皮癌"},
  {en:"lipoma", jp:"脂肪腫"},
  {en:"cryotherapy", jp:"凍結療法"},
  {en:"laser therapy", jp:"レーザー治療"},
  {en:"dressing change", jp:"ガーゼ交換"},
  {en:"skin graft", jp:"植皮術"}
];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
