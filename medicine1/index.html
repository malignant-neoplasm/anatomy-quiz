<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;

const words = [
  {en:"head", jp:"頭[部]"},
  {en:"temple", jp:"こめかみ"},
  {en:"hair", jp:"頭髪，毛"},
  {en:"scalp", jp:"頭皮"},
  {en:"forehead", jp:"額，前額"},
  {en:"face", jp:"顔"},
  {en:"eyebrow", jp:"眉[毛]"},
  {en:"glabella", jp:"眉間"},
  {en:"eyelid / palpebra", jp:"まぶた，眼瞼"},
  {en:"eyelash / cilium", jp:"まつ毛，睫毛"},
  {en:"eye", jp:"眼"},
  {en:"pupil", jp:"瞳孔"},
  {en:"dimple", jp:"えくぼ，くぼみ"},
  {en:"cheek", jp:"頬"},
  {en:"mole / lentigo", jp:"黒子"},
  {en:"ear", jp:"耳"},
  {en:"nose", jp:"鼻"},
  {en:"nostril / naris", jp:"鼻孔"},
  {en:"mouth", jp:"口"},
  {en:"gum / gingiva", jp:"歯肉"},
  {en:"lip", jp:"唇，口唇"},
  {en:"tooth", jp:"歯"},
  {en:"tongue", jp:"舌"},
  {en:"jaw", jp:"顎"},
  {en:"chin", jp:"おとがい，あご先"},
  {en:"mustache", jp:"口ひげ"},
  {en:"beard", jp:"あごひげ"},
  {en:"throat", jp:"喉"},
  {en:"Adam's apple / laryngeal prominence", jp:"喉仏，喉頭隆起"},
  {en:"neck", jp:"首，頸部"},
  {en:"nape / nucha", jp:"うなじ"},
  {en:"trunk", jp:"体幹"},
  {en:"shoulder", jp:"肩"},
  {en:"armpit / axilla", jp:"腋窩，わきの下"},
  {en:"chest / thorax", jp:"胸部"},
  {en:"breast", jp:"乳房"},
  {en:"nipple", jp:"乳頭，乳首"},
  {en:"belly / abdomen", jp:"腹部"},
  {en:"side / flank", jp:"脇腹，側腹部"},
  {en:"waist", jp:"ウエスト，腰"},
  {en:"navel / umbilicus", jp:"へそ"},
  {en:"groin", jp:"鼠径部"},
  {en:"back / dorsum", jp:"背中，背部"},
  {en:"buttocks", jp:"臀部"},
  {en:"genitals", jp:"生殖器"},
  {en:"limb / extremity", jp:"四肢，手足"},
  {en:"arm", jp:"腕"},
  {en:"upper arm / brachium", jp:"上腕"},
  {en:"forearm / antebrachium", jp:"前腕"},
  {en:"elbow", jp:"肘"},
  {en:"hand", jp:"手"},
  {en:"wrist", jp:"手首"},
  {en:"palm", jp:"手のひら，手掌"},
  {en:"finger", jp:"指"},
  {en:"thumb", jp:"親指，拇指"},
  {en:"index finger", jp:"人差し指，示指"},
  {en:"middle finger", jp:"中指"},
  {en:"ring finger", jp:"薬指，環指"},
  {en:"little finger", jp:"小指"},
  {en:"nail", jp:"爪"},
  {en:"fingerprint", jp:"指紋"},
  {en:"leg", jp:"脚"},
  {en:"foot", jp:"足"},
  {en:"thigh / femur", jp:"ふともも，大腿"},
  {en:"knee", jp:"膝"},
  {en:"shin", jp:"脛"},
  {en:"calf", jp:"ふくらはぎ，下腿"},
  {en:"ankle", jp:"足首，足関"},
  {en:"toe", jp:"足指"},
  {en:"heel", jp:"かかと"},
  {en:"instep", jp:"足の甲"},
  {en:"arch [of the foot]", jp:"土踏まず"},
  {en:"sole", jp:"足底"}
];


function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
