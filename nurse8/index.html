<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Quiz</title>

<style>
/* ===== 全体 ===== */
#quiz {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

/* ===== 操作ボタン ===== */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 999px;
  border: none !important;
  background: #1976d2 !important;
  color: #fff !important;
  font-weight: bold;
  font-size: 0.9em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.btn:nth-child(2) {
  background: #43a047 !important;
}

.btn:nth-child(3) {
  background: #757575 !important;
}

/* ===== リスト ===== */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  list-style: none;
}

/* ===== カード ===== */
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
}

/* ===== 問題 ===== */
.q {
  flex: 1;
  font-weight: 600;
  font-size: 0.95em;
  line-height: 1.35;
}

/* ===== 答え ===== */
.a {
  width: 140px;
  min-width: 140px;
  max-width: 140px;
  min-height: 34px;

  background: #444;
  color: #444;
  border-radius: 8px;

  display: block;

  font-size: 0.85em;
  text-align: center;
  line-height: 1.3;

  padding: 6px 8px;
  box-sizing: border-box;

  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;

  flex-shrink: 0;
  cursor: pointer;
}

.a.show {
  background: #e3f2fd;
  color: #1565c0;
}

.a:hover {
  background: #e3f2fd;
  color: #1565c0;
}

/* ===== 音声ボタン ===== */
.speak-btn {
  background: #eef2f7;
  border: none;
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>

<body>

<div id="quiz">
  <div class="controls">
    <button class="btn" onclick="toggleMode()">🔁 英→日</button>
    <button class="btn" onclick="render(true)">🔀 シャッフル</button>
    <button class="btn" onclick="render(false)">標準順</button>
  </div>

  <ul id="list" class="list"></ul>
</div>

<script>
let isEnglishMode = true;

const words = [
  {en:"red blood cell / erythrocyte", jp:"赤血球"},
  {en:"white blood cell / leukocyte", jp:"白血球"},
  {en:"blood plasma", jp:"血漿"},
  {en:"platelet / thrombocyte", jp:"血小板"},
  {en:"blood vessel", jp:"血管"},
  {en:"vein", jp:"静脈"},
  {en:"artery", jp:"動脈"},
  {en:"capillary", jp:"毛細血管"},
  {en:"lymph", jp:"リンパ"},
  {en:"lymph node", jp:"リンパ節"},
  {en:"cell", jp:"細胞"},
  {en:"tissue", jp:"組織"},
  {en:"fluid", jp:"液体、体液"},
  {en:"membrane", jp:"膜"},
  {en:"mucus", jp:"粘液"},
  {en:"secretion", jp:"分泌"},
  {en:"hormone", jp:"ホルモン"},
  {en:"saliva", jp:"唾液"},
  {en:"nerve", jp:"神経"},
  {en:"central nervous system", jp:"中枢神経系"},
  {en:"peripheral nervous system", jp:"末梢神経系"},
  {en:"sympathetic nerve", jp:"交感神経"},
  {en:"parasympathetic nerve", jp:"副交感神経"},
  {en:"olfactory nerve", jp:"嗅神経"},
  {en:"optic nerve", jp:"視神経"},
  {en:"excretion", jp:"排泄"},
  {en:"urine", jp:"尿"},
  {en:"feces / stool", jp:"大便"},
  {en:"bowel movement", jp:"排便、便通"},
  {en:"circulation", jp:"循環"},
  {en:"digestion", jp:"消化"},
  {en:"onset", jp:"発症、発現"},

  {en:"lesion", jp:"病変、病巣"},
  {en:"accumulation", jp:"蓄積"},
  {en:"clot[ting] / coagulation", jp:"凝固[作用]"},
  {en:"inflammation", jp:"炎症"},
  {en:"obstruction", jp:"閉塞[症]"},
  {en:"necrosis", jp:"壊死"},
  {en:"pus", jp:"膿"},
  {en:"cyst", jp:"嚢胞"},
  {en:"life expectancy", jp:"平均余命"},
  {en:"mortality [rate]", jp:"死亡[率]"},
  {en:"prevalence", jp:"有病率"},
  {en:"incidence", jp:"発生[数、率]"},
  {en:"tumor", jp:"腫瘍、腫瘤"},
  {en:"neoplasm", jp:"新生物、腫瘍"},
  {en:"metastasis", jp:"転移"},
  {en:"carcinogen", jp:"発がん物質"},
  {en:"vaccination / immunization", jp:"予防接種"},
  {en:"vaccine", jp:"ワクチン"},
  {en:"virus", jp:"ウイルス"},
  {en:"side effect", jp:"副作用"},
  {en:"antibody", jp:"抗体"},
  {en:"addiction", jp:"依存症、常用、中毒"},
  {en:"obesity", jp:"肥満[症]"},
  {en:"intervention", jp:"[治療的]介入"},
  {en:"empathy", jp:"共感、感情移入"},
  {en:"diaper", jp:"おむつ"}
];

必要なら次に、このデータをそのまま入れた完成HTML版も作る。


function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function toggleMode() {
  isEnglishMode = !isEnglishMode;
  document.querySelector(".controls .btn").textContent =
    isEnglishMode ? "🔁 英→日" : "🔁 日→英";
  render(false);
}

function render(doShuffle) {
  let list = [...words];
  if (doShuffle) list = shuffle(list);

  let html = "";

  list.forEach(w => {
    const q = isEnglishMode ? w.en : w.jp;
    const a = isEnglishMode ? w.jp : w.en;
    const speakText = w.en;

    html += `
      <li class="item">
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${speakText.replace(/'/g, "\\'")}')">🔊</button>
        <span class="q">${q}</span>
        <span class="a" onclick="this.classList.toggle('show')">${a}</span>
      </li>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

render(false);
</script>

</body>
</html>
